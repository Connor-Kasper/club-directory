services:
  mysql:
    image: mysql:8.4
    container_name: clubhub-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: clubhub
      MYSQL_DATABASE: club_directory
    volumes:
      - clubhub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pclubhub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clubhub-mysql-data:
